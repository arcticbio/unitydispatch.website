name: Deploy to Azure Static Web Apps

# Production deploys on pushes to main; pull requests get a preview
# environment. CI (ci.yml) runs first and must pass. Needs the
# AZURE_STATIC_WEB_APPS_API_TOKEN repository secret (see README) and does
# nothing until it exists.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Manual runs only deploy main; other branches would otherwise overwrite production.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure not configured yet
        if: env.SWA_TOKEN == ''
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so nothing was deployed."

      - name: Deploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          output_location: ""
          skip_app_build: true
          production_branch: main

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close preview environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
