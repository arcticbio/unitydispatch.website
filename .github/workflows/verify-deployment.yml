name: Verify Azure deployment (temporary)

# One-off check of the first Azure deployment from GitHub's runners (the
# Azure URL isn't reachable from the authoring sandbox). Removed after use.
on:
  push:
    branches: [claude/practical-hawking-mdth5a]
    paths: [.github/workflows/verify-deployment.yml]

permissions:
  contents: read

env:
  BASE_URL: https://brave-mud-0d1a7b91e.1.azurestaticapps.net

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Routing, headers and API
        run: |
          set -u
          fail=0
          expect() { # name, expected, actual
            if [ "$2" = "$3" ]; then echo "  ok    $1 ($3)"; else echo "  FAIL  $1: expected $2, got $3"; fail=1; fi
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          loc() { curl -s -o /dev/null -w '%{redirect_url}' "$1"; }
          for p in / /privacy-policy /refund-policy /terms-and-conditions /shipping-policy /accessibility /sitemap.xml /robots.txt /favicon.ico; do
            expect "GET $p" 200 "$(code "$BASE_URL$p")"
          done
          expect "title /" "Home | Unity Dispatch" "$(curl -s "$BASE_URL/" | grep -o '<title>[^<]*' | sed 's/<title>//')"
          expect "title /privacy-policy" "$(grep -o '<title>[^<]*' site/privacy-policy/index.html | sed 's/<title>//')" "$(curl -s "$BASE_URL/privacy-policy" | grep -o '<title>[^<]*' | sed 's/<title>//')"
          expect "GET /no-such-page" 404 "$(code "$BASE_URL/no-such-page")"
          curl -s "$BASE_URL/no-such-page" | grep -q 'Page Not Found' && echo "  ok    404 page body" || { echo "  FAIL  404 page body"; fail=1; }
          expect "/home redirects" "$BASE_URL/" "$(loc "$BASE_URL/home")"
          expect "/index.html redirects" "$BASE_URL/" "$(loc "$BASE_URL/index.html")"
          expect "trailing slash removed" "$BASE_URL/privacy-policy" "$(loc "$BASE_URL/privacy-policy/")"

          echo "Headers on /:"
          curl -sI "$BASE_URL/" | grep -iE '^(content-type|content-security-policy|strict-transport-security|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|cache-control):' | sed 's/^/    /'
          want_hash=$(grep -o "sha256-[A-Za-z0-9+/=]*" site/staticwebapp.config.json)
          curl -sI "$BASE_URL/" | grep -i '^content-security-policy:' | grep -q -- "$want_hash" && echo "  ok    CSP carries inline script hash" || { echo "  FAIL  CSP missing $want_hash"; fail=1; }
          css=$(curl -s "$BASE_URL/" | grep -o '/assets/css/site.css?v=[a-f0-9]*')
          echo "  css cache-control: $(curl -sI "$BASE_URL$css" | grep -i '^cache-control:' | tr -d '\r')"
          echo "  font content-type: $(curl -sI "$BASE_URL/assets/fonts/jost-latin-wght-normal.woff2" | grep -i '^content-type:' | tr -d '\r')"

          echo "Contact API (no delivery channel configured yet, so 503 / #contact-failed is expected):"
          expect "GET /api/contact rejected" 1 "$(c=$(code "$BASE_URL/api/contact"); [ "$c" = 404 ] || [ "$c" = 405 ] && echo 1 || echo "$c")"
          body='{"source":"contact-form","page":"/","firstName":"Deploy","lastName":"Check","email":"check@example.com","message":"Automated deployment check","website":""}'
          echo "  POST json -> $(curl -s -w ' [%{http_code}]' -H 'content-type: application/json' -H "origin: $BASE_URL" -d "$body" "$BASE_URL/api/contact")"
          echo "  POST form -> $(curl -s -o /dev/null -w '[%{http_code}] %{redirect_url}' -H "referer: $BASE_URL/privacy-policy" --data-urlencode firstName=Deploy --data-urlencode email=check@example.com --data-urlencode message=check --data-urlencode website= "$BASE_URL/api/contact")"
          exit $fail

      - uses: actions/setup-node@v6
        if: always()
        with:
          node-version: 22
          cache: npm

      - name: Browser checks against Azure
        if: always()
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
